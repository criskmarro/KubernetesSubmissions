name: Build and release The Project

on:
  push:
    branches:
      - main
    paths:
      - 'the_project/**'
      - '.github/workflows/project-gitops.yaml'

permissions:
  contents: write
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  REGISTRY: us-east1-docker.pkg.dev
  REPOSITORY: kubernetes

jobs:
  build-publish-release:
    name: Build, Publish, Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout configuration repository
        uses: actions/checkout@v4
        with:
          repository: criskmarro/kubernetes-project-config
          ref: main
          path: project-config
          token: ${{ secrets.CONFIG_REPO_TOKEN || github.token }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud --quiet auth configure-docker $REGISTRY

      - name: Build and publish images
        run: |
          docker build -t "$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-app:$GITHUB_SHA" ./the_project/todo-app
          docker build -t "$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-backend:$GITHUB_SHA" ./the_project/todo-backend
          docker build -t "$REGISTRY/$PROJECT_ID/$REPOSITORY/broadcaster:$GITHUB_SHA" ./the_project/broadcaster
          docker build -t "$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-reminder:$GITHUB_SHA" ./the_project/todo-cronjob
          docker build -t "$REGISTRY/$PROJECT_ID/$REPOSITORY/postgres-backup:$GITHUB_SHA" ./the_project/backup-cronjob

          docker push "$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-app:$GITHUB_SHA"
          docker push "$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-backend:$GITHUB_SHA"
          docker push "$REGISTRY/$PROJECT_ID/$REPOSITORY/broadcaster:$GITHUB_SHA"
          docker push "$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-reminder:$GITHUB_SHA"
          docker push "$REGISTRY/$PROJECT_ID/$REPOSITORY/postgres-backup:$GITHUB_SHA"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update released image versions
        working-directory: ./project-config
        run: |
          kustomize edit set image todo-app=$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-app:$GITHUB_SHA
          kustomize edit set image todo-backend=$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-backend:$GITHUB_SHA
          kustomize edit set image broadcaster=$REGISTRY/$PROJECT_ID/$REPOSITORY/broadcaster:$GITHUB_SHA
          kustomize edit set image todo-reminder=$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-reminder:$GITHUB_SHA
          kustomize edit set image postgres-backup=$REGISTRY/$PROJECT_ID/$REPOSITORY/postgres-backup:$GITHUB_SHA

      - name: Commit release configuration
        env:
          CONFIG_REPO_TOKEN: ${{ secrets.CONFIG_REPO_TOKEN }}
        run: |
          if [ -z "$CONFIG_REPO_TOKEN" ]; then
            echo "CONFIG_REPO_TOKEN is not configured for this workflow." >&2
            exit 1
          fi

          git -C project-config remote set-url origin "https://x-access-token:$CONFIG_REPO_TOKEN@github.com/criskmarro/kubernetes-project-config.git"
          git -C project-config config user.name "github-actions[bot]"
          git -C project-config config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C project-config ls-remote --heads origin main >/dev/null
          git -C project-config fetch origin main
          git -C project-config checkout -B main origin/main
          git -C project-config add kustomization.yaml

          if ! git -C project-config diff --cached --quiet; then
            git -C project-config commit -m "Release the project $GITHUB_SHA"
            git -C project-config push origin HEAD:main
          else
            echo "No configuration changes were detected; nothing to publish."
          fi
