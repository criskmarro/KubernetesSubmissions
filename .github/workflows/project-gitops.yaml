name: Build and release The Project

on:
  push:
    branches:
      - main
    paths:
      - 'the_project/**'
      - '.github/workflows/project-gitops.yaml'

permissions:
  contents: write

env:
  CONFIG_REPOSITORY: criskmarro/kubernetes-project-config
  IMAGE_TAG: ${{ github.sha }}
  CONFIG_REPO_TOKEN: ${{ secrets.CONFIG_REPO_TOKEN }}

jobs:
  release-configuration:
    name: Update configuration repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code repository
        uses: actions/checkout@v4

      - name: Validate config repository token
        run: |
          if [ -z "$CONFIG_REPO_TOKEN" ]; then
            echo "Missing CONFIG_REPO_TOKEN secret in this repository." >&2
            echo "Create a repository secret named CONFIG_REPO_TOKEN in KubernetesSubmissions with a Fine-grained PAT that has Contents: Read and write access to criskmarro/kubernetes-project-config." >&2
            exit 1
          fi

      - name: Checkout configuration repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CONFIG_REPOSITORY }}
          ref: main
          path: project-config
          token: ${{ env.CONFIG_REPO_TOKEN }}

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update image tags in configuration repo
        working-directory: ./project-config
        run: |
          kustomize edit set image todo-app=todo-app:$IMAGE_TAG
          kustomize edit set image todo-backend=todo-backend:$IMAGE_TAG
          kustomize edit set image broadcaster=broadcaster:$IMAGE_TAG
          kustomize edit set image todo-reminder=todo-reminder:$IMAGE_TAG
          kustomize edit set image postgres-backup=postgres-backup:$IMAGE_TAG

      - name: Commit and push configuration changes
        env:
          GH_TOKEN: ${{ env.CONFIG_REPO_TOKEN }}
        run: |
          git -C project-config remote set-url origin "https://x-access-token:$GH_TOKEN@github.com/${{ env.CONFIG_REPOSITORY }}.git"
          git -C project-config config user.name "github-actions[bot]"
          git -C project-config config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C project-config add kustomization.yaml

          if ! git -C project-config diff --cached --quiet; then
            git -C project-config commit -m "Release the project $GITHUB_SHA"
            git -C project-config push origin HEAD:main
          else
            echo "No configuration changes were detected; nothing to publish."
          fi
