name: Build and release Log Output

on:
  push:
    branches:
      - main
    paths:
      - 'log_output/**'
      - '.github/workflows/log-output-gitops.yaml'

permissions:
  contents: write
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  REGISTRY: us-east1-docker.pkg.dev
  REPOSITORY: kubernetes

jobs:
  build-publish-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Configure Docker
        run: gcloud --quiet auth configure-docker $REGISTRY

      - name: Build and publish images
        run: |
          WRITER_IMAGE="$REGISTRY/$PROJECT_ID/$REPOSITORY/log-writer:$GITHUB_SHA"
          READER_IMAGE="$REGISTRY/$PROJECT_ID/$REPOSITORY/log-reader:$GITHUB_SHA"
          PING_PONG_IMAGE="$REGISTRY/$PROJECT_ID/$REPOSITORY/ping-pong:$GITHUB_SHA"

          docker build -t "$WRITER_IMAGE" ./log_output/writer
          docker build -t "$READER_IMAGE" ./log_output/reader
          docker build -t "$PING_PONG_IMAGE" ./log_output/ping-pong

          docker push "$WRITER_IMAGE"
          docker push "$READER_IMAGE"
          docker push "$PING_PONG_IMAGE"

          echo "WRITER_IMAGE=$WRITER_IMAGE" >> "$GITHUB_ENV"
          echo "READER_IMAGE=$READER_IMAGE" >> "$GITHUB_ENV"
          echo "PING_PONG_IMAGE=$PING_PONG_IMAGE" >> "$GITHUB_ENV"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update the released image versions
        working-directory: ./log_output
        run: |
          kustomize edit set image log-writer=$WRITER_IMAGE
          kustomize edit set image log-reader=$READER_IMAGE
          kustomize edit set image ping-pong=$PING_PONG_IMAGE

      - name: Commit release configuration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add log_output/kustomization.yaml
          git diff --cached --quiet || git commit -m "Release log output $GITHUB_SHA"
          git push
