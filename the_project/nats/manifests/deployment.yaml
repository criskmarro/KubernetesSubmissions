apiVersion: apps/v1
kind: Deployment

metadata:
  namespace: project
  name: nats-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: nats

  template:
    metadata:
      labels:
        app: nats

    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          args: ["-m", "8222"]

          ports:
            - containerPort: 4222
            - containerPort: 8222

          readinessProbe:
            tcpSocket:
              port: 4222
            initialDelaySeconds: 2
            periodSeconds: 5

          livenessProbe:
            tcpSocket:
              port: 4222
            initialDelaySeconds: 10
            periodSeconds: 10

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
